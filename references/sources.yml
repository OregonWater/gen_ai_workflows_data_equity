# Stable source keys; examples provide structure, not research evidence.
# name, kind, location, tracked, bib retain the seed registry schema.
# Additional verification notes make the status of each input explicit.
sources:
  midcoast-water-rights-memo-2021:
    name: "Burright and Lovellford: Water Rights Summary for Mid-Coast Planning Area and Sub-Areas"
    kind: technical-memorandum
    location: "references/source-pdfs/TechMemo_MidCoastWaterRightsSummary_2021-10-29_Final (1).pdf"
    tracked: false
    bib: null
    verification: "Checked 2026-10-22: read PDF pages 1–4 of 44 and visually inspected page 3. October 29, 2021 OWRD memorandum to the Mid-Coast Water Planning Partnership; methods use WRIS data accessed October 11, 2019. Methods document regional/basin-scale design limitations, counting/apportionment risks, omitted permit conditions and authorization/use distinctions. The methods discussion continues onto page 4. No independent replication of calculations or review of the full report is claimed. This later memorandum does not verify the 2016 article's methods or prove an error in its map."
  draining-oregon-2016:
    name: "House and Graves: Draining Oregon — Water Giveaway Threatens Economic Chaos and Hurts Wildlife"
    kind: news-article
    location: "references/source-pdfs/Draining_Oregon_The_Oregonian.pdf"
    tracked: false
    bib: null
    verification: "Checked 2026-10-22: extracted text from all 18 PDF pages; visually inspected pages 2, 5, 11 and 13, including the spatial comparison map. Supplied PDF is a WaterWatch republication identifying a July 26, 2016 Oregonian article by Kelly House and Mark Graves. Checked as evidence of published analysis and reported disagreement, not validation of its calculations. Data extracts, methods, code, record translation and underlying responses have not been checked. The PDF does not establish that reporters lacked SME input or misunderstood WRIS structure."
  renv-sandbox-docs:
    name: "renv documentation: the default library sandbox"
    kind: website
    location: "https://rstudio.github.io/renv/reference/sandbox.html"
    tracked: false
    bib: null
    verification: "Checked 2026-10-22: sandbox purpose, configuration and RENV_PATHS_SANDBOX. Installed renv 1.2.4 functions were also inspected and the temporary-path configuration tested locally. The web documentation currently describes renv 1.3.1; it is not evidence of the local lock holder or its cause."
  taps-genai-initial-presentation:
    name: "Author-provided TAPs GenAI presentation with speaker notes (initial workflow account)"
    kind: presentation
    location: "references/source-pdfs/taps-genai-final-speaker-notes.pdf"
    tracked: false
    bib: null
    verification: "Reviewed 2026-10-13: 23 pages of speaker notes, visual contact sheet and detailed diagrams on pages 8 and 13. Last-updated text July 24, 2026. Author clarifies initial account, not final specification; design-to-build transition with incomplete staircase steps. Underlying implementation and benefits not independently verified."
