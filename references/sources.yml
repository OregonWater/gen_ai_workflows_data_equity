    location: "https://arxiv.org/html/2102.09692"
    tracked: false
    bib: bucinca2021trust
    verification: "Screened 2026-10-22: authors' Harvard indexed abstract and arXiv manuscript abstract/introduction. Published PACM HCI 5(CSCW1), DOI 10.1145/3449287. Reported N=199 and intervention/preference trade-off checked; complete methods/statistical analysis not reviewed. Task-specific decision support, not direct evidence for GenAI repositories or TAPs."
