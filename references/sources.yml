# Stable source keys; examples provide structure, not research evidence.
# name, kind, location, tracked, bib retain the seed registry schema.
# Additional verification notes make the status of each input explicit.
sources:
  bommasani-etal-2021-foundation-models:
    name: "Bommasani et al.: On the Opportunities and Risks of Foundation Models"
    kind: research-report
    location: "https://arxiv.org/abs/2108.07258"
    tracked: false
    bib: null
    verification: "Screened 2026-10-25: arXiv abstract/metadata only (2021 submission, revised 2022). Checked characterization of foundation models as trained on broad data and adaptable across downstream tasks. Full report not read; does not establish a coherent internal world, historical uniqueness, or TAPs outcomes."
  lewis-etal-2020-rag:
    name: "Lewis et al. (2020): Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks"
    kind: conference-paper
    location: "https://arxiv.org/abs/2005.11401"
    tracked: false
    bib: null
    verification: "Screened 2026-10-25: arXiv abstract/metadata only. Checked distinction between pretrained parametric memory and external document retrieval, illustrated by the paper's Wikipedia index. Methods and reported performance not assessed. Used to qualify training-data-access and chatbot schematics, not to characterize every present system."
  brown-etal-2020-few-shot:
    name: "Brown et al. (2020): Language Models are Few-Shot Learners"
    kind: research-paper
    location: "https://arxiv.org/abs/2005.14165"
    tracked: false
    bib: null
    verification: "Screened 2026-10-25: arXiv abstract/metadata only. Abstract describes GPT-3's pretraining and text-specified tasks without gradient updates in that evaluation. No full-paper or contemporary-system assessment. Consulted during clarification of training versus present interaction; not authority for a universal chatbot architecture."
  expert-systems-panel-2017:
    name: "AAAI-17 panel on expert-systems history: Feigenbaum, Buchanan, Davis and Horvitz"
    kind: oral-history
    location: "https://archive.computerhistory.org/resources/access/text/2018/03/102738236-05-01-acc.pdf"
    tracked: false
    bib: null
    verification: "Targeted check 2026-10-25: participant retrospective transcript, printed pp. 2–5, especially Feigenbaum's account on p. 3 of DENDRAL combining mass-spectrometry data with elicited chemical expertise in the 1960s. Historical counterexample to first-ever knowledge-bearing mediation; not independent archival verification or an adopted talk example. Initial publisher-paper retrieval failed; no claim to have read that paper."
  rosenberger-verbeek-2024-ihde:
    name: "Rosenberger and Verbeek (2024): Don Ihde: 1934–2024"
    kind: journal-article
    location: "references/source-pdfs/DON_IHDE_1934_-_2024.pdf"
    tracked: false
    bib: rosenbergerverbeek2024ihde
    verification: "Metadata checked 2026-10-25: visually inspected PDF page 1, including the recommended citation, authors, year, journal, volume/issue, pages and DOI. Embedded PDF author metadata names a different person and was not used for attribution. Memorial/current-affairs article; body text extracted but not substantively assessed. No theoretical or historical claim promoted."
  ihde-1991-instrumental-realism:
    name: "Ihde (1991): Instrumental Realism: The Interface between Philosophy of Science and Philosophy of Technology"
    kind: book-excerpt
    location: "references/source-pdfs/idhe_1991_instrumental-realism.pdf"
    tracked: false
    bib: ihde1991instrumental
    verification: "Metadata checked 2026-10-25: visually inspected title and copyright spreads (PDF pages 1–2); author, title, publisher, series and 1991 copyright confirmed. The local 12-page PDF is an excerpt, not the complete book. Both hardback and paperback ISBNs appear in its cataloging block; neither binding is inferred. No substantive assessment or whole-book reading claimed. Filename spelling retained."
  ihde-1990-phenomenology-technics:
    name: "Ihde (1990): Program One: A Phenomenology of Technics, chapter 5 of Technology and the Lifeworld"
    kind: book-chapter
    location: "references/source-pdfs/technology-and-lifeworld.pdf"
    tracked: false
    bib: ihde1990technics
    verification: "Advanced 2026-10-25: metadata checked from delivery cover and chapter opening; targeted assistant text reading of printed pp. 72–78 and 84–86, with visual checks of pp. 75–76 and 85–86. PDF page equals printed page minus 70. Checked embodiment, transformative non-neutrality, amplification/reduction, design conditions and interpretive instrumentation for the first claim mapping. Detailed open assessment: references/source-assessments/ihde-1990-phenomenology-technics.md. No whole-chapter/book review, independent historical verification, author endorsement, social-privilege inference or TAPs outcome established. Local PDF contains chapter 5, not the whole book; delivery identifiers are not reproduced."
  verbeek-2001-ihde-lifeworld:
    name: "Verbeek (2001): Don Ihde: The Technological Lifeworld"
    kind: book-chapter
    location: "references/source-pdfs/verbeek_YYYY_don-ihde-technological-lifeworld.pdf"
    tracked: false
    bib: verbeek2001ihde
    verification: "Advanced 2026-10-25: earlier metadata check used chapter spreads, author list https://ppverbeek.org/publications/ and publisher https://iupress.org/9780253214492/american-philosophy-of-technology/ for the 2001 host book and pp. 119–146. First targeted assistant visual reading now covers printed pp. 124–131 (PDF spreads 4–7): bodily/interpretive perception, embodiment/hermeneutic relations, amplification/reduction, representational design and relational constitution. Detailed open assessment: references/source-assessments/verbeek-2001-ihde-lifeworld.md. Exposition and elaboration of Ihde, not independent empirical corroboration. No full-chapter review, author endorsement, social-privilege/equity conclusion or TAPs outcome established. Scan has no extractable text and includes neighboring chapter fragments; filename retained."
  verbeek-beyond-human-eye:
    name: "Verbeek (2007): Beyond the Human Eye: Technological Mediation and Posthuman Visions"
    kind: book-chapter
    location: "references/source-pdfs/peter-paul_verbeek_YYYY_beyond-human-eye-tech-mediation-posthuman-visions.pdf"
    tracked: false
    bib: verbeekBeyondHumanEye
    verification: "Metadata checked 2026-10-25: visually inspected opening and extracted opening/closing text of seven-page local PDF; author/title confirmed. Author supplied https://research.utwente.nl/en/publications/beyond-the-human-eye-technological-meditation-and-posthuman-visio/ ; assistant checked this institutional record, which identifies the 2007 chapter in Mediated Vision (English edition), editor P.J.H. Kockelkoren, Veenman Publishers, Arnhem/Rotterdam, pages 43?53, ISBN 978-90-8690-105-0. Bibliography uses those publication details and the title printed on the PDF; institutional title misspells mediation as meditation. Local PDF is separately paginated 1?7; exact textual identity with the published chapter remains unchecked. The separate 2005 conference record is not merged. No substantive assessment claimed."
  verbeek-mediation-theory:
    name: "Peter-Paul Verbeek: Mediation Theory (introductory webpage)"
    kind: author-webpage
    location: "https://ppverbeek.org/mediation-theory/"
    tracked: false
    bib: null
    verification: "Checked 2026-10-25: assistant read the author's introductory webpage, including its account of technologies in use shaping human-world relations, postphenomenological roots and implications for design. Supports only introductory orientation for the pivot discussion. Linked articles, book chapter and animation have not been assessed; no full framework, TAPs application or outcome claim is validated."
  kirsh-2010-external-representations:
    name: "Kirsh (2010): Thinking with external representations"
