project:
  output-dir: _site-focused
  # Keep these as explicit paths: the link filter reads this same selection.
  render:
    - index.qmd
    - artifacts/talk/deck.qmd
    - knowledge-base/01_core-thesis-and-contribution.md
    - knowledge-base/04_claims-evidence-risk-register.md
    - knowledge-base/08_audience-and-venue.md
    - admin/governance.md
    - admin/decisions-register.md
    - admin/project-log.md
    - sessions/2026-10-28.md
    - sessions/2026-10-30.md
    - docs/reproducibility-notes.md
    - docs/smart-folder.md
    - "!/tmp/"
website:
  site-url: https://oregonwater.github.io/gen_ai_workflows_data_equity/
  sidebar:
    style: docked
    contents:
      - index.qmd
      - artifacts/talk/deck.qmd
      - text: A smart folder?
        href: docs/smart-folder.md
      - section: Preparation
        contents:
          - knowledge-base/01_core-thesis-and-contribution.md
          - knowledge-base/04_claims-evidence-risk-register.md
          - knowledge-base/08_audience-and-venue.md
      - section: Project record
        contents:
          - admin/governance.md
          - admin/decisions-register.md
          - admin/project-log.md
          - sessions/2026-10-28.md
          - sessions/2026-10-30.md
      - docs/reproducibility-notes.md
filters:
  - tools/focused-links.lua
